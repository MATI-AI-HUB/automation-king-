name: CI

on:
  push:
    branches: [main, p1-owner-hardening, 'feat/**', '260929-feat-code-readiness-hardened-db']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging_matrix:
        description: 'Run staging role-matrix tests (requires STAGING_* secrets)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fqqdpngmftoddffvdukn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SITE_URL: https://banglarvoice24news.com

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on hardcoded JWT blobs
        run: |
          if git grep -n -E 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' -- ':!*.md' ':!docs/**' ':!.github/**'; then
            echo 'Potential JWT secret material in source. Remove before merge.'
            exit 1
          fi
          echo 'No JWT blob in tracked non-doc files.'
      - name: Fail if NEXT_PUBLIC_ wraps service-role / openai / secret keys
        run: |
          if git grep -n -E 'NEXT_PUBLIC_.*(SERVICE_ROLE|SECRET|OPENAI_KEY|OPENAI_API_KEY)' -- ':!*.md' ':!docs/**' ':!.env.example'; then
            echo 'P0: secret-like name under NEXT_PUBLIC_.'
            exit 1
          fi
          echo 'No NEXT_PUBLIC_ service-role/openai/secret names.'

  backend:
    name: Backend (go build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: archive/backend/go.mod
          cache-dependency-path: archive/backend/go.sum
      - run: go build ./...

  staging-role-matrix:
    name: Staging role matrix (on demand)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_staging_matrix }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run staging matrix
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: npx vitest run __tests__/staging-role-matrix.test.ts

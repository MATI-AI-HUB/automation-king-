name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging_matrix:
        description: 'Run staging role-matrix tests (needs STAGING_* secrets)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx vitest run

  frontend:
    name: Frontend (typecheck + lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on hardcoded JWT blobs
        run: |
          if git grep -n -E 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' -- ':!*.md' ':!docs/**' ':!.github/**'; then
            echo 'Potential JWT secret material in source. Remove before merge.'
            exit 1
          fi
          echo 'No JWT blob in tracked non-doc files.'

  backend:
    name: Backend (go build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: archive/backend/go.mod
          cache-dependency-path: archive/backend/go.sum
      - run: go build ./...

  staging-role-matrix:
    name: Staging role-matrix (on demand)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_staging_matrix }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Refuse production ref
        run: |
          set -euo pipefail
          case "${STAGING_SUPABASE_URL:-}" in
            *rcffuqkofvuezgbjcixj*) echo "staging job refused production ref"; exit 1 ;;
          esac
      - run: npx vitest run __tests__/staging-role-matrix.test.ts